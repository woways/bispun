<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link
      rel="icon"
      type="image/png"
      href="/brand/bispun-icon.png?v=3"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Bispun</title>

    <!--
      Native-only cold-start splash. Hidden by default so the WEBSITE startup is
      unchanged; the inline script below reveals it ONLY inside the Capacitor
      native app (window.Capacitor.isNativePlatform()). It bridges the gap
      between the Android system splash and React's first paint (no white flash);
      main.jsx removes it once the app has mounted.
    -->
    <style>
      /* Display face for finance figures / KPI numbers (applied via className="font-display"). */
      .font-display { font-family: "Space Grotesk", "Inter", ui-sans-serif, system-ui, sans-serif; }
      #bispun-splash { display: none; }
      html.bispun-native-boot #bispun-splash {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #f6f7fb;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      }
      #bispun-splash.bispun-splash-hide {
        opacity: 0;
        transition: opacity 220ms ease;
        pointer-events: none;
      }
      #bispun-splash img {
        width: 96px;
        height: 96px;
        object-fit: contain;
      }
      #bispun-splash .bispun-dots { display: flex; gap: 8px; }
      #bispun-splash .bispun-dots span {
        width: 9px;
        height: 9px;
        border-radius: 9999px;
        background: #4f46e5;
        animation: bispunDot 1.1s ease-in-out infinite;
      }
      #bispun-splash .bispun-dots span:nth-child(2) { animation-delay: 0.18s; }
      #bispun-splash .bispun-dots span:nth-child(3) { animation-delay: 0.36s; }
      @keyframes bispunDot {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
        40% { transform: translateY(-7px); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #bispun-splash .bispun-dots span { animation: none; opacity: 0.85; }
      }
    </style>
    <script>
      // Reveal the branded splash ONLY in the Capacitor native app. In any web
      // browser this is a no-op, so the website startup is byte-for-byte the same.
      try {
        if (window.Capacitor && typeof window.Capacitor.isNativePlatform === "function" && window.Capacitor.isNativePlatform()) {
          document.documentElement.classList.add("bispun-native-boot");
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="bispun-splash" aria-hidden="true">
      <img src="/brand/bispun-icon.png?v=3" alt="" />
      <div class="bispun-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
